# nginx configured the way the hosts use it today, for the same sites as
# shioko.conf, so the same requests can go to both.
worker_processes auto;
events { worker_connections 1024; }
http {
    access_log off;
    client_max_body_size 1m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    ssl_protocols TLSv1.3;

    server {
        listen 80 default_server;
        location /.well-known/acme-challenge/ { root /var/lib/shioko/acme; }
        location / { return 404; }
    }
    server {
        listen 80;
        server_name vault.test media.test chat.test files.test;
        location /.well-known/acme-challenge/ { root /var/lib/shioko/acme; }
        location / { return 301 https://$host$request_uri; }
    }
    server {
        listen 80;
        server_name wiki.internal;
        allow 10.88.0.0/24;
        deny all;
        location / { proxy_pass http://10.88.0.20:8080; }
    }
    server {
        listen 443 ssl;
        server_name vault.test;
        ssl_certificate /certs/vault.test.chain.pem;
        ssl_certificate_key /certs/vault.test.key;
        client_max_body_size 525m;
        allow 10.88.0.0/24;
        deny all;
        location / {
            proxy_pass http://10.88.0.21:80;
            # A proxy_set_header here drops every inherited one, so all
            # are repeated.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
    server {
        listen 443 ssl;
        server_name media.test;
        ssl_certificate /certs/media.test.chain.pem;
        ssl_certificate_key /certs/media.test.key;
        location / {
            proxy_pass http://10.88.0.22:8096;
            # A proxy_set_header here drops every inherited one, so all
            # are repeated.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
    server {
        listen 443 ssl;
        server_name chat.test;
        ssl_certificate /certs/chat.test.chain.pem;
        ssl_certificate_key /certs/chat.test.key;
        location / {
            proxy_pass http://10.88.0.20:8080;
            # A proxy_set_header here drops every inherited one, so all
            # are repeated.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
    server {
        listen 443 ssl;
        server_name files.test;
        ssl_certificate /certs/files.test.chain.pem;
        ssl_certificate_key /certs/files.test.key;
        client_max_body_size 525m;
        location / { proxy_pass http://10.88.0.20:8080; }
    }
}
