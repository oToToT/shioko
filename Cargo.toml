[package]
name = "shioko"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A small TLS 1.3 reverse proxy for sites behind one local HTTP upstream each"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oToToT/Shioko"
publish = false

# The only third-party code: libcrux (formally verified crypto), pinned to
# exact versions here and by checksum in Cargo.lock. Only src/crypto.rs may
# use these.
[dependencies]
libcrux-sha2 = "=0.0.10"
libcrux-chacha20poly1305 = "=0.0.11"
libcrux-curve25519 = "=0.0.10"
libcrux-p256 = { version = "=0.0.10", features = ["expose-hacl"] }
libcrux-ecdsa = { version = "=0.0.10", default-features = false }
# ML-KEM-768 for the X25519MLKEM768 hybrid: the portable code only, no
# SIMD, no rand.
libcrux-ml-kem = { version = "=0.0.12", default-features = false, features = ["mlkem768"] }

[features]
# Test builds only, for checking recorded runs (tools/tlstrace.py): every
# handshake's shared secret is appended to the file named by SHIOKO_KEYLOG.
# Never deploy a binary built with it.
keylog = []
# Development builds only, for checking recorded runs against
# spec/Server.tla (tools/servertrace.py): the steps of the server's threads
# and slots go to the file named by SHIOKO_RECORD. Never deploy it.
record = []
# Proofs only: tools/prove.sh big checks every proof for longer inputs than
# CI does (`cfg(kani)` code only; nothing else changes).
kani-big = []

# libcrux's CPU-feature detection needs libc; shioko uses only the portable
# code, so its own stand-in, which detects nothing, takes its place.
[patch.crates-io]
libcrux-platform = { path = "patches/libcrux-platform" }

# The proxy tests run it on several hundred thousand scripted connections.
[profile.test]
opt-level = 2

[profile.release]
overflow-checks = true
panic = "unwind"
codegen-units = 1
lto = true
strip = true

[lints.rust]
# Denied everywhere but in the few functions that allow it by name and say
# why each block is sound (SPEC.md section 4).
unsafe_code = "deny"
# `cfg(kani)` marks the proofs that tools/prove.sh checks with Kani;
# `cfg(fuzzing)` is set in the fuzz targets' build (fuzz/), `cfg(shuttle)`
# in the build of shuttle/ (src/sync.rs).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(fuzzing)', 'cfg(shuttle)'] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
