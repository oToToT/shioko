\* Checks the run in ServerRecorded.tla (written by tools/servertrace.py).
INIT TraceInit
NEXT TraceNext
CONSTANTS Cap <- RecordedCap
          PerAddress <- RecordedPerAddress
          Conns <- RecordedConns
          Addresses <- RecordedAddresses
          PublicTls <- RecordedPublicTls
          Listeners = {"l80", "l443"}
          Secure = {"l443"}
INVARIANT TypeOK
INVARIANT CapRespected
INVARIANT PerAddressRespected
INVARIANT ReservationsBounded
INVARIANT SlotsAccounted
INVARIANT PoolsAccounted
INVARIANT NoStrayThread
INVARIANT OneWriter
INVARIANT ReadingNeverWaits
CHECK_DEADLOCK FALSE
