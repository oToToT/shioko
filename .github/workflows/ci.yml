# Verifies every push to main and every pull request: each stage of
# tools/ci.sh as a job of its own, on the architecture it checks, and the
# end-to-end environment of ci/e2e/ (tools/e2e.sh) twice: with the build
# that is deployed, and with the development build whose whole run TLC
# checks against spec/Server.tla. Everything runs in the Docker images of
# ci/, so a failure here can be reproduced with the same command locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ${{ matrix.stage }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: specs, runner: ubuntu-24.04 }
          - { stage: proofs, runner: ubuntu-24.04 }
          - { stage: interop, runner: ubuntu-24.04 }
          - { stage: unit, runner: ubuntu-24.04 }
          - { stage: tlsfuzzer, runner: ubuntu-24.04 }
          - { stage: fuzz, runner: ubuntu-24.04 }
          - { stage: linux/amd64, runner: ubuntu-24.04 }
          - { stage: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools/ci.sh ${{ matrix.stage }}
        run: tools/ci.sh "$STAGE"
        env:
          STAGE: ${{ matrix.stage }}

  e2e:
    name: e2e ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: checks, args: "" }
          - { name: record, args: record }
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools/e2e.sh ${{ matrix.args }}
        run: tools/e2e.sh ${ARGS:+"$ARGS"}
        env:
          ARGS: ${{ matrix.args }}
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.name }}
          path: |
            target/e2e/
            !target/e2e/*.tlc/states/
          if-no-files-found: ignore
          retention-days: 14
